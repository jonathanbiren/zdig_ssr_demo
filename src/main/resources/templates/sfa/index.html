<!DOCTYPE html>
<html lang="en" th:replace="~{layout.html::layout('SFA', ~{::section})}" xmlns:th="http://www.thymeleaf.org">

<section
        class="h-full flex flex-col gap-4 p-4 mx-auto w-full max-w-7xl mt-2"
        x-data="{ selectedId: null, slideOverOpen: false }"
>
    <div class="flex flex-wrap items-center justify-between gap-4 bg-base-200 rounded-box p-4 shadow-sm">
        <div class="flex items-center gap-3">
            <span class="font-medium">Kundenanzahl</span>
            <span class="badge badge-primary badge-lg" th:text="${kundenListe.size()}">0</span>
        </div>
        <label class="form-control w-full max-w-xs">
            <span class="label py-1">
                Search for id
            </span>
            <!--            So hx-sync="this:replace" reads literally as: "sync against myself; when I issue a new request while one of-->
            <!--            mine is still in flight, abort the in-flight one and replace it with the new one."-->
            <input type="text"
                   name="sucheingabe"
                   placeholder="z. B. 123"
                   class="input input-bordered w-full"
                   hx-trigger="input changed delay:300ms"
                   hx-get="/kunden"
                   hx-target="#kundenTabelle"
                   hx-swap="outerHTML"
                   hx-sync="this:replace"
            >
        </label>
    </div>

    <div class="text-sm bg-base-200/50 rounded-box px-4 py-2 font-mono">
        selectedId: <span x-text="selectedId === null ? '—' : selectedId" class="text-primary"></span>
    </div>

    <div class="flex-1 min-h-0 overflow-auto rounded-box border border-base-300 bg-base-100 shadow-sm">
        <table id="kundenTabelle" th:fragment="kundenTabelle" class="table table-lg table-pin-rows table-zebra">
            <thead>
            <tr class="bg-base-200">
                <th>ID</th>
                <th>Kurzname</th>
                <th>Name</th>
                <th>ZS-NR</th>
                <th>Adresse</th>
                <th>Status</th>
                <th>Besonders Schützenswert</th>
                <th>Aktion</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="kunde : ${kundenListe}"
                th:attr="x-data=${'{ rowId: ' + kunde.id + ' }'}"
                class="row-hover cursor-pointer"
                :class="selectedId == rowId ? 'active' : ''"
                @click="selectedId = rowId; slideOverOpen = true"
            >
                <td th:text="${kunde.id}"></td>
                <td th:text="${kunde.kurzname}"></td>
                <td th:text="${kunde.name}"></td>
                <td th:text="${kunde.zsNummer}"></td>
                <td th:text="${kunde.adresse}"></td>
                <td th:text="${kunde.status}"></td>
                <td th:text="${kunde.istBesondersSchuetzenswert}"></td>
                <td @click.stop>
                    <button class="btn btn-neutral btn-sm"
                            th:hx-delete="@{/kunden/{id}(id=${kunde.id})}"
                            hx-target="closest tr"
                            hx-swap="outerHTML">
                        Delete
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <aside
            class="relative z-50 w-auto h-auto">
        <template x-teleport="body">
            <div
                    x-show="slideOverOpen"
                    @keydown.window.escape="slideOverOpen=false"
                    class="relative z-99">
                <div class="overflow-hidden fixed inset-0">
                    <div class="overflow-hidden absolute inset-0">
                        <div class="flex fixed inset-y-0 right-0 pl-10 max-w-full">
                            <div
                                    x-show="slideOverOpen"
                                    @click.away="slideOverOpen = false"
                                    x-transition:enter="transform transition ease-in-out duration-500 sm:duration-700"
                                    x-transition:enter-start="translate-x-full"
                                    x-transition:enter-end="translate-x-0"
                                    x-transition:leave="transform transition ease-in-out duration-500 sm:duration-700"
                                    x-transition:leave-start="translate-x-0"
                                    x-transition:leave-end="translate-x-full"
                                    class="w-screen max-w-md">
                                <div class="flex overflow-y-scroll flex-col py-5 h-full bg-white border-l shadow-lg border-neutral-100/70">
                                    <div class="px-4 sm:px-5">
                                        <div class="flex justify-between items-start pb-1">
                                            <h2 class="text-base font-semibold leading-6 text-gray-900"
                                                id="slide-over-title">Slide Over Title</h2>
                                            <div class="flex items-center ml-3 h-auto">
                                                <button @click="slideOverOpen=false"
                                                        class="flex absolute right-0 z-30 justify-center items-center px-3 py-2 mt-6 mr-5 space-x-1 text-xs font-medium uppercase rounded-md border border-neutral-200 text-neutral-600 hover:bg-neutral-100">
                                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                                         viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                                                         class="w-4 h-4">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                              d="M6 18L18 6M6 6l12 12"></path>
                                                    </svg>
                                                    <span>Close</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="relative flex-1 px-4 mt-5 sm:px-5">
                                        <div class="absolute inset-0 px-4 sm:px-5">
                                            <div class="overflow-hidden relative h-full rounded-md border border-dashed border-neutral-300"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </aside>


</section>
</html>
