spring.application.name=soldaten-wohnen
spring.threads.virtual.enabled=true

#application information
info.app.name=soldaten-wohnen
info.app.version=0.0.1
info.app.description=soldaten-wohnen platform

#exposing actuator endpoints
#Link to all actuator endpoints https://docs.spring.io/spring-boot/reference/actuator/endpoints.html
#Great for application monitoring during development
management.endpoints.web.exposure.include=*

# DataSource. You tell JDBC where your database is running. These are all of the arguments that you need to pass to the
# Spring Data JDBC adapter so that it can connect to JDBC.
# This is why you will always need to start up the database before you can run the Spring
# Boot application. Because Spring will go looking for this database on startup
spring.datasource.url=jdbc:postgresql://localhost:5432/soldaten_wohnen
spring.datasource.username=soldaten_wohnen
spring.datasource.password=soldaten_wohnen
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# jOOQ. The DSLContext is auto-configured by spring-boot-starter-jooq on the DataSource above.
# Setting the dialect explicitly keeps generated SQL predictable even if the DataSource URL ever changes.
spring.jooq.sql-dialect=postgres

# Security
spring.security.user.name=biren
spring.security.user.password=biren

# TLS setup
# Activating this will result in the certificate.p12 file being used for TLS.
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store=classpath:certificate.p12
#server.ssl.key-store-password=12345

#Docker Compose
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start_and_stop

#Change the port on which the application runs
server.port=8080

# JTE (Java Template Engine) setup
# Templates are located in src/main/kte/. Controllers return full .kte filenames
# so IntelliJ can provide file completion and navigation; no suffix is appended.
# In development, templates are hot-reloaded on change (requires a JDK).
# For production, set gg.jte.developmentMode=false and
# gg.jte.usePrecompiledTemplates=true. The jte-maven-plugin generate goal
# produces .kt source files during the build that the Kotlin compiler
# compiles into the application JAR.
gg.jte.templateLocation=src/main/kte
gg.jte.template-suffix=
gg.jte.developmentMode=true
gg.jte.trimControlStructures=true

# Spring Boot DevTools
# Restart on classpath changes (Kotlin/Java files)
# LiveReload on static resource changes (CSS, JS, images)
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/static/css/src/main/kte

# Poll every second for changes (useful if file system events are unreliable)
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
