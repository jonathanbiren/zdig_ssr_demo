<html lang="de" xmlns:th="http://www.thymeleaf.org">

<!--Head Fragment-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | SoWo'">Soldaten Wohnen</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!--    This is the path through which Spring exposes the Webjars-->
    <script type="text/javascript" th:src="@{/webjars/htmx.org/4.0.0-beta4/dist/htmx.min.js}" defer></script>
    <script type="text/javascript" th:src="@{/webjars/alpinejs/3.15.12/dist/cdn.min.js}" defer></script>
</head>

<!--Header Fragment-->
<header th:fragment="header" class="border-b border-white/10 bg-slate-950/85 backdrop-blur">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
        <a th:href="@{/wohnungen}" class="group flex items-center gap-3">
            <span class="grid size-10 place-items-center rounded-2xl bg-lime-300 font-black text-slate-950 shadow-lg shadow-lime-300/20">SW</span>
            <span>
                <span class="block text-sm font-semibold uppercase tracking-[0.28em] text-lime-200">Soldaten Wohnen</span>
                <span class="block text-xs text-slate-400">Wohnraumvermittlung fuer den Standortwechsel</span>
            </span>
        </a>
        <div class="hidden items-center gap-6 text-sm text-slate-300 sm:flex">
            <a th:href="@{/wohnungen}" class="hover:text-white">Wohnungen</a>
            <a href="mailto:vermittlung@soldaten-wohnen.local"
               class="rounded-full border border-white/15 px-4 py-2 hover:border-lime-200 hover:text-white">Kontakt</a>
        </div>
    </nav>
</header>

<!--Separator-->
<div th:fragment="separator(content, hyperlink)" class="border-dashed border-2 border-b-red-600 w-10">
    <a class="sr-only" th:text="${content}" th:href="${hyperlink}"></a>
</div>

</html>
